# Local stack. Two ways to run it:
#
#   docker compose up -d --wait                       the database only (the API runs from the venv,
#                                                     see the project notes "How to run")
#   docker compose --profile app up --build --wait    the whole app in containers: database, one-off
#                                                     migration, api, and the web container
#                                                     (nginx) on http://localhost:${WEB_PORT:-3000}
#
#   docker compose down             stop it (data is kept in the named volume)
#   docker compose down -v          stop it AND delete the data; the init script then re-runs
#
# Passwords come from the git-ignored `.env` at the repository root. Nothing secret lives here.
#
# The `app` profile publishes the web container on the same port as `npm run dev` (3000), so it
# reuses the Google redirect URI you already registered, and the two cannot run at the same time.
# It is a local stand-in for CloudFront + S3 (ADR 006); the api itself is never published.
name: stock-analyst

# One image, several commands (ADR 008): `api` and `migrate` are built from the same definition.
# No `image:` name is set anywhere on purpose: Compose tags what it builds with the project name,
# so a second project (the container tests) can never overwrite the images of this one.
x-backend-build: &backend-build
  context: ./backend

# What the api container is not allowed to do. Both containers below run with these.
x-hardened: &hardened
  read_only: true # the image contents cannot be changed at run time
  tmpfs:
    - /tmp # the only writable place
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  db:
    # Pinned to a specific verified tag (pgvector 0.8.6 on PostgreSQL 16, Debian bookworm).
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    restart: unless-stopped
    environment:
      # The image creates this user as a superuser: it plays the role of the RDS master user, i.e.
      # the privileged MIGRATION role (creates extensions and tables). The API never uses it.
      POSTGRES_USER: ${POSTGRES_USER:-stock_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-stock_analyst}
      # Read by docker/postgres-init/01-roles-and-databases.sh to create the RUNTIME role.
      APP_DB_USER: ${APP_DB_USER:-stock_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env (copy .env.example)}
    ports:
      # Loopback only: the database is never exposed to the network. DB_PORT avoids clashes with a
      # PostgreSQL you may already run locally.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts here run once, when the volume is first created (hence `down -v` to re-run them).
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 matters: while the image runs the init scripts it starts a temporary server
      # that listens on a unix socket only. Checking over TCP means "healthy" is reported only
      # after the init scripts have finished and the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # ---- the `app` profile: not started by a plain `docker compose up` ---------------------------

  # Runs `alembic upgrade head` once, with the privileged role, then exits. It is the ONLY service
  # that receives the admin credentials.
  migrate:
    profiles: [app]
    build: *backend-build
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      MIGRATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-stock_admin}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-stock_analyst}
    depends_on:
      db:
        condition: service_healthy

  # The API, as the runtime role (no DDL rights). Not published to the host: the browser reaches it
  # through `web`. Variables are listed one by one (never `env_file`), so nothing reaches the
  # container by accident. The Google and session settings use `${VAR:-}` rather than `${VAR:?}`:
  # Compose checks `:?` even for services in an inactive profile, which would break the plain
  # database-only command. An empty value makes the api refuse to start, naming the setting.
  api:
    profiles: [app]
    build: *backend-build
    <<: *hardened
    environment:
      APP_ENV: local
      COOKIE_SECURE: "false" # plain-HTTP localhost cannot store a Secure cookie
      # The origin the BROWSER uses (the published web port): it drives the redirect URI and the
      # Origin check. The PUBLIC_BASE_URL in `.env` is for tools run on the host, not for this.
      PUBLIC_BASE_URL: http://localhost:${WEB_PORT:-3000}
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:-stock_app}:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}@db:5432/${POSTGRES_DB:-stock_analyst}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # The same switch as the worker's: with it on, a follow or the "Check for new filings" button
      # queues a check; with it off, the api queues nothing the worker could not run (ADR 018).
      FILINGS_DISCOVERY: ${FILINGS_DISCOVERY:-false}
      # Search turns each question into a fingerprint on Bedrock (P10b): the same switch and the same
      # temporary pass as the worker (see there). Empty by default.
      EMBEDDINGS_ENABLED: ${EMBEDDINGS_ENABLED:-false}
      # The grounded chat (P12) asks Nova 2 Lite once or twice per question, with the same
      # temporary pass, and stops at the owner's approved cap. Off by default.
      CHAT_ENABLED: ${CHAT_ENABLED:-false}
      CHAT_BUDGET_USD: ${CHAT_BUDGET_USD:-1.00}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    # No file storage: the api only reads document metadata from the database. The worker alone
    # writes and reads the stored PDFs (uploads were removed in P9d).
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The worker (P9): the same image with another command. It claims jobs from the database, fetches
  # official filings when FILINGS_DISCOVERY is on (ADR 018; off unless you set it in `.env`), and
  # turns PDFs into page text and chunks. The runtime role only, and no Google or session secrets:
  # it handles no logins. Nothing is published; it only makes outbound requests.
  worker:
    profiles: [app]
    build: *backend-build
    <<: *hardened
    command: ["python", "-m", "app.worker"]
    # A worker that crashes comes back, as ECS does in AWS: in P10's first real run it died of a
    # segmentation fault (exit 139) and stayed down. Its jobs are safe: an interrupted job is
    # claimed again once its lease runs out, and every write is idempotent.
    restart: unless-stopped
    environment:
      # The code is in /app/src. uvicorn is told so with --app-dir; `python -m` needs this instead
      # (the same as the provision task in infra/stack).
      PYTHONPATH: /app/src
      # If native code ever crashes Python again, print every thread's stack to the log.
      PYTHONFAULTHANDLER: "1"
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:-stock_app}:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}@db:5432/${POSTGRES_DB:-stock_analyst}
      BLOB_ROOT: /data/blobs
      FILINGS_DISCOVERY: ${FILINGS_DISCOVERY:-false}
      # Meaning fingerprints on Bedrock (P10, ADR 019): off unless switched on. The AWS pass is a
      # TEMPORARY one copied from the owner's `aws login` into the shell that runs `compose up`
      # (aws configure export-credentials); empty otherwise. Never in .env, never in an image, and
      # only this container gets it. In AWS the ECS task role takes its place (GL).
      EMBEDDINGS_ENABLED: ${EMBEDDINGS_ENABLED:-false}
      # Facts and events read from filings by the LLM (P11, ADR 020): off unless switched on; the
      # same temporary pass. Spending is capped by EXTRACTION_BUDGET_USD (default $2).
      EXTRACTION_ENABLED: ${EXTRACTION_ENABLED:-false}
      # The owner approved $2; set it lower for a first test run (for example 0.01).
      EXTRACTION_BUDGET_USD: ${EXTRACTION_BUDGET_USD:-2.00}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    volumes:
      - blobs:/data/blobs
    # The image's HEALTHCHECK calls the api's /api/healthz, which the worker does not serve.
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

  # nginx serving the static export and forwarding /api to the api (see frontend/nginx.conf). It
  # holds no configuration and no secrets. Loopback only, like the database.
  web:
    profiles: [app]
    build:
      context: ./frontend
    <<: *hardened
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  # Stored PDFs: the worker's alone (P9d).
  blobs:
