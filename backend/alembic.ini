# Alembic configuration. It holds NO database URL and NO credentials, on purpose: the privileged
# migration URL is supplied at run time (see migrations/env.py and ADR 011).

[alembic]
script_location = migrations

# Separate, git-ignored file that may hold MIGRATION_DATABASE_URL for local development. Resolved
# relative to this file. The API's own `.env` must never contain that URL. A real environment
# variable always takes precedence over this file.
migration_env_file = ../.env.migration

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
