# The pipeline (P8b): every push to main is checked, and only a commit that passes every check is
# built and pushed to ECR, tagged with its commit SHA. Deploying that image is P8c.
#
#   backend ─┐
#   frontend ├─> image   (the only job that can reach AWS, through OIDC: no stored keys)
#   infra ───┘
#
# The three check jobs run in parallel and never see an AWS credential. The rules this file must
# keep are tested in infra/tests/test_pipeline_workflow.py.
#
# Third-party actions are pinned to a commit SHA, with the release it came from in a comment: a tag
# can be moved by whoever controls the action's repository, a commit cannot.

name: pipeline

on:
  push:
    branches: [main]
  workflow_dispatch: # re-run by hand from the Actions tab

# The default token for every job: read the repository, nothing else.
permissions:
  contents: read

# One run at a time, and a run that has started always finishes: cancelling a push halfway would
# leave the registry and, from P8c, the running service in a state no commit describes.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install the locked dependencies
        working-directory: backend
        run: |
          python -m pip install uv==0.12.17
          uv sync --frozen

      - name: Lint, format and types
        working-directory: backend
        run: |
          .venv/bin/ruff check src tests migrations
          .venv/bin/ruff format --check src tests migrations
          .venv/bin/mypy src tests migrations

      # Fresh random passwords on every run, masked in the log. The database lives only on this
      # runner's loopback and is gone when the job ends; nothing is stored in GitHub.
      - name: Generate throwaway database passwords
        run: |
          for name in POSTGRES_PASSWORD APP_DB_PASSWORD; do
            value=$(openssl rand -hex 24)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      # The same Compose file and pinned image as local development, so the integration tests run
      # against the same PostgreSQL + pgvector, the same init script and the same two roles.
      - name: Start PostgreSQL + pgvector
        run: docker compose up -d --wait

      - name: Unit, API and integration tests with the coverage gate
        working-directory: backend
        run: .venv/bin/python -m pytest --cov

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Build the static export
        run: npm run build

  infra:
    name: Infrastructure (Terraform offline, hygiene)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.3"
          terraform_wrapper: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Offline only: -backend=false and mock providers, so no state is read and AWS is never called.
      # Every root is formatted and validated. preflight's test is the one exception: its whole
      # purpose is to prove the owner's real AWS login works, so it has no mock and never runs here.
      - name: Terraform format, validate and test (every root)
        run: |
          terraform fmt -check -recursive infra
          for root in preflight bootstrap edge cicd stack; do
            echo "::group::infra/$root"
            (cd "infra/$root" && terraform init -backend=false -input=false && terraform validate)
            if [ "$root" != preflight ]; then (cd "infra/$root" && terraform test); fi
            echo "::endgroup::"
          done

      - name: CloudFront Function test
        run: node --test infra/edge/functions/rewrite-index.test.mjs

      - name: Repository hygiene tests
        run: |
          python -m pip install uv==0.12.17
          (cd backend && uv sync --frozen)
          backend/.venv/bin/python -m pytest infra/tests

  image:
    name: Build and push the backend image
    needs: [backend, frontend, infra]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The only job that may ask GitHub for an OIDC token. AWS trades it for one-hour credentials
    # for the push-only role (infra/cicd/github.tf), and only for this repository's main branch.
    # No `environment:` here: it would change the token's subject and the role would refuse it.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.CI_ROLE_ARN }}
          aws-region: ap-south-1

      # Tags are immutable (infra/cicd/registry.tf), so a re-run of a commit that was already pushed
      # must stop before the push rather than fail on it.
      - name: Build and push, tagged with the commit SHA
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          registry="$account.dkr.ecr.ap-south-1.amazonaws.com"
          repository="stock-analyst-demo-backend"
          image="$registry/$repository:$GITHUB_SHA"

          existing=$(aws ecr batch-get-image --repository-name "$repository" \
            --image-ids "imageTag=$GITHUB_SHA" --query 'images[0].imageId.imageDigest' --output text)
          if [[ "$existing" == sha256:* ]]; then
            echo "Commit $GITHUB_SHA is already in ECR as $existing; nothing to push."
            exit 0
          fi

          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          docker build --tag "$image" backend
          docker push "$image"
          echo "Pushed $repository:$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
