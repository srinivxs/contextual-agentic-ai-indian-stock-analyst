# The pipeline: every push to main is checked; only a commit that passes every check is built and
# pushed to ECR, tagged with its commit SHA (P8b), and then deployed (P8c, ADR 017).
#
#             ┌─> backend ─┐
#   changes ──┼─> frontend ├─> image ──> deploy (backend, then the site)
#             └─> infra ───┘
#
# ONLY WHAT CHANGED (the owner, 2026-10-08): `changes` compares this commit with the newest green
# run. A push that changes only frontend/ skips the backend tests, the image and the backend
# rollout and goes straight to publishing the site (a few minutes instead of twelve); a push that
# does not touch frontend/ does not republish the site. Any doubt runs everything.
#
# The check jobs run in parallel and never see an AWS credential. `image` and `deploy` reach
# AWS through OIDC (no stored keys), each with its own role: pushing and deploying are different
# powers. The rules this file must keep are tested in infra/tests/test_pipeline_workflow.py.
#
# Third-party actions are pinned to a commit SHA, with the release it came from in a comment: a tag
# can be moved by whoever controls the action's repository, a commit cannot.

name: pipeline

on:
  push:
    branches: [main]
  workflow_dispatch: # re-run by hand from the Actions tab

# The default token for every job: read the repository, nothing else.
permissions:
  contents: read

# One run at a time, and a run that has started always finishes: cancelling a push halfway would
# leave the registry or the running service in a state no commit describes.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: What changed since the last green run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Reads the repository and the list of runs (to find the last green one); nothing else.
    permissions:
      contents: read
      actions: read
    outputs:
      backend: ${{ steps.parts.outputs.backend }}
      frontend: ${{ steps.parts.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Compare with the newest successful run on main
        id: parts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pipeline.yml --branch main \
            --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          python3 .github/scripts/changed_parts.py "$base"

  backend:
    name: Backend (lint, types, tests)
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install the locked dependencies
        working-directory: backend
        run: |
          python -m pip install uv==0.12.17
          uv sync --frozen

      - name: Lint, format and types
        working-directory: backend
        run: |
          .venv/bin/ruff check src tests migrations
          .venv/bin/ruff format --check src tests migrations
          .venv/bin/mypy src tests migrations

      # Fresh random passwords on every run, masked in the log. The database lives only on this
      # runner's loopback and is gone when the job ends; nothing is stored in GitHub.
      - name: Generate throwaway database passwords
        run: |
          for name in POSTGRES_PASSWORD APP_DB_PASSWORD; do
            value=$(openssl rand -hex 24)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      # The same Compose file and pinned image as local development, so the integration tests run
      # against the same PostgreSQL + pgvector, the same init script and the same two roles.
      - name: Start PostgreSQL + pgvector
        run: docker compose up -d --wait

      - name: Unit, API and integration tests with the coverage gate
        working-directory: backend
        run: .venv/bin/python -m pytest --cov

  frontend:
    name: Frontend (lint, types, tests, build)
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Build the static export
        run: npm run build

  infra:
    name: Infrastructure (Terraform offline, hygiene)
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.3"
          terraform_wrapper: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Offline only: -backend=false and mock providers, so no state is read and AWS is never called.
      # Every root is formatted and validated. preflight's test is the one exception: its whole
      # purpose is to prove the owner's real AWS login works, so it has no mock and never runs here.
      - name: Terraform format, validate and test (every root)
        run: |
          terraform fmt -check -recursive infra
          for root in preflight bootstrap edge cicd stack; do
            echo "::group::infra/$root"
            (cd "infra/$root" && terraform init -backend=false -input=false && terraform validate)
            if [ "$root" != preflight ]; then (cd "infra/$root" && terraform test); fi
            echo "::endgroup::"
          done

      - name: CloudFront Function test
        run: node --test infra/edge/functions/rewrite-index.test.mjs

      - name: Repository hygiene, workflow and deploy-script tests
        run: |
          python -m pip install uv==0.12.17
          (cd backend && uv sync --frozen)
          backend/.venv/bin/ruff check infra/tests docker/tests .github/scripts
          backend/.venv/bin/ruff format --check infra/tests docker/tests .github/scripts
          backend/.venv/bin/mypy --strict .github/scripts infra/tests
          backend/.venv/bin/python -m pytest infra/tests

  image:
    name: Build and push the backend image
    needs: [changes, backend, frontend, infra]
    # A plain condition keeps GitHub's implicit success(): any failed or skipped check stops it.
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # AWS trades this job's OIDC token for one-hour credentials for the push-only role
    # (infra/cicd/github.tf), and only for this repository's main branch. No `environment:` on any
    # job: it would change the token's subject and the role would refuse it.
    permissions:
      contents: read
      id-token: write
    # The digest names the exact bytes that passed the checks. Only the digest is handed on: the
    # deploy job reads the registry's address from SSM itself.
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.CI_ROLE_ARN }}
          aws-region: ap-south-1
          mask-aws-account-id: true

      # Tags are immutable (infra/cicd/registry.tf), so a re-run of a commit that was already pushed
      # skips the push rather than failing on it, and hands on the digest that is already there.
      - name: Build and push, tagged with the commit SHA
        id: push
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          registry="$account.dkr.ecr.ap-south-1.amazonaws.com"
          repository="stock-analyst-demo-backend"
          image="$registry/$repository:$GITHUB_SHA"

          pushed_digest() {
            aws ecr batch-get-image --repository-name "$repository" \
              --image-ids "imageTag=$GITHUB_SHA" --query 'images[0].imageId.imageDigest' --output text
          }

          digest=$(pushed_digest)
          if [[ "$digest" == sha256:* ]]; then
            echo "Commit $GITHUB_SHA is already in ECR as $digest; nothing to push."
          else
            aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
            docker build --tag "$image" backend
            docker push "$image"
            digest=$(pushed_digest)
            echo "Pushed $repository:$GITHUB_SHA ($digest)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy (backend while the stack is up, then the frontend)
    needs: [changes, frontend, infra, image]
    # The image is skipped for a frontend-only push, which would skip this job too; so it says
    # when it runs: never after a cancel or a failed check, and only with a pushed image unless
    # the backend did not change at all. (A failed backend check skips the image, and then the
    # backend DID change, so this does not run.)
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.frontend.result == 'success' &&
      needs.infra.result == 'success' &&
      (needs.image.result == 'success' ||
      (needs.image.result == 'skipped' && needs.changes.outputs.backend == 'false'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The deploy role (infra/cicd/deploy.tf): run the migration, update the one service, sync the
    # site, invalidate the cache. Same trust as the push role, different power.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
          mask-aws-account-id: true

      # Migrate, roll out, check /api/readyz; or, with the stack down, nothing. A failure here stops
      # the job, so the frontend below is never published ahead of a backend that did not deploy.
      - name: Deploy the backend
        if: needs.changes.outputs.backend == 'true'
        env:
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: python3 .github/scripts/deploy_backend.py

      # The edge is permanent, so the site is published whether or not the stack is up; and only
      # when frontend/ changed, so a backend push does not re-upload every file to S3.
      - name: Publish the frontend
        if: needs.changes.outputs.frontend == 'true'
        run: |
          (cd frontend && npm ci && npm run build)
          bucket=$(aws ssm get-parameter --name /stock-analyst/demo/site_bucket_name \
            --query Parameter.Value --output text)
          distribution=$(aws ssm get-parameter --name /stock-analyst/demo/distribution_id \
            --query Parameter.Value --output text)
          aws s3 sync frontend/out "s3://$bucket/" --delete
          aws cloudfront create-invalidation --distribution-id "$distribution" --paths "/*" \
            --query Invalidation.Id --output text
