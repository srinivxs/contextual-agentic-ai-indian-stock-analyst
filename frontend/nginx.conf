# The web container: serves the static export and forwards /api to the backend.
#
# This is the LOCAL stand-in for CloudFront + S3 (ADR 006, ADR 008): one origin for pages and API, so
# the browser needs no CORS and the backend's Origin check and session cookie work unchanged. It
# is not deployed; AWS uses CloudFront. It is copied over the image's default server block.
#
# Rules that matter, each pinned by a test in docker/tests:
#   * /api is passed through untouched: same path, same headers (Origin, Cookie), same response
#     (redirects, Set-Cookie, and error bodies). The backend's JSON 404 is never replaced by a page.
#   * An unknown page is a real 404, never a fallback to index.html.
#   * Redirects are relative: the container listens on 8080 but the browser reaches it on another
#     port, so an absolute Location would send it to the wrong place.
#
# Known limitation: nginx looks up `api` once, when it starts. `restart` of the api container keeps
# its address, but if the api container is RECREATED and gets a new address, restart web as well.
# Handling that (a resolver with a variable) is deliberately left out of P6.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # No URI after the host: with one, nginx would rewrite the request path.
    location /api/ {
        proxy_pass http://api:8000;
        # Never rewrite a Location header: the browser must see exactly what the backend sent.
        proxy_redirect off;
    }

    # Hashed file names (a new build means new names), so they can be cached for good.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Pages: always revalidate, so a new build is picked up. `route/index.html` per page.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }
}
